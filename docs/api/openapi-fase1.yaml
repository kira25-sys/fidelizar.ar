openapi: 3.0.3
info:
  title: Fidelizar API — Phase 1 (Counter web)
  version: "1.0.0-f1"
  description: >
    F1-04b's REST contract. Hand-written — no OpenAPI generation package was added
    (CLAUDE.md: no new dependency without asking; a static document needs none).
    Endpoints marked `x-status: pending` are contract-only: no controller exists for them
    because no Application service backs them yet. See docs/REST-CONTRACT-F1.md for the
    endpoint-by-endpoint rationale and the service each pending one is waiting on.
servers:
  - url: /api

tags:
  - name: Auth
    description: S1 Ingreso
  - name: Miembros
    description: S2, S3, S5, S6, S14
  - name: Movimientos
    description: S4, S7, S8
  - name: Sucursales
    description: S9, S10
  - name: Usuarios
    description: S10

paths:
  # ---------------------------------------------------------------------
  # S1 · Ingreso — implemented (F1-03)
  # ---------------------------------------------------------------------
  /auth/csrf-token:
    get:
      tags: [Auth]
      summary: Antiforgery token for the login screen (S1)
      x-status: implemented
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }

  /auth/login:
    post:
      tags: [Auth]
      summary: S1 Ingreso — sign in
      x-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: Signed in. Sets the HttpOnly auth cookie (ARCHITECTURE §8).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Auth]
      summary: S1 — sign out
      x-status: implemented
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        "204": { description: Signed out. }
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: "Quién soy — also renews the session cookie silently (ARCHITECTURE §8)"
      x-status: implemented
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------
  # S2 · Buscar socio — implemented
  # ---------------------------------------------------------------------
  /miembros:
    get:
      tags: [Miembros]
      summary: S2 Buscar socio — search by name (FUNCTIONAL-SPEC §4)
      x-status: implemented
      description: >
        Backed by IMiembroBusquedaService.BuscarAsync, which queries NombreNormalizado
        (any query word must appear as a substring — accent/case folding already baked
        into NombreNormalizado) and rejects a query under 3 normalised characters with
        400 BUSQUEDA_MUY_CORTA rather than falling back to a listing. There is
        deliberately no "list all members" variant of this endpoint for any role below
        Dueño (FUNCTIONAL-SPEC §4, ARCHITECTURE §8).
      security: [{ cookieAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3 }
          description: Cashiers search; there is no browsing (FUNCTIONAL-SPEC §4).
      responses:
        "200":
          description: OK — candidates, each with enough to disambiguate homonyms, never phone/DNI.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MiembroResumen' }
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Miembros]
      summary: S5 Alta de socio (FUNCTIONAL-SPEC §7)
      x-status: implemented
      description: >
        Backed by IAltaMiembroService.DarDeAltaAsync, which writes the Miembro and the mandatory
        DatosPersonales Consentimiento row in one IUnitOfWork transaction (I10) — if either write
        fails, neither lands. consentimientoDatosPersonales=false is rejected before anything is
        written (400 CONSENTIMIENTO_DATOS_PERSONALES_REQUERIDO). consentimientoDatosSensibles is
        optional: the approved text says explicitly that membership does not require it, so alta
        succeeds either way. Saldo is always 0 in the response — a brand-new member has no ledger
        rows yet.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AltaMiembroRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiembroResumen' }
        "400":
          description: >
            NOMBRE_REQUERIDO, CONSENTIMIENTO_DATOS_PERSONALES_REQUERIDO (I10),
            FECHA_NACIMIENTO_INCOMPLETA (day without month or vice versa) or SUCURSAL_INEXISTENTE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: CLIENTE_EXTERNO_ID_DUPLICADO — this POS id is already linked to another member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /miembros/consentimiento-texto/{tipo}:
    get:
      tags: [Miembros]
      summary: S5 — the resolved consent wording to show the member before either checkbox
      x-status: implemented
      description: >
        Backed by IConsentimientoTextoService.ObtenerAsync. Resolves TextosConsentimiento's fixed
        template with the caller's own Negocio (name, CUIT, and — for DatosPersonales — address),
        never a business literal shipped to the client (CLAUDE.md). Only DatosPersonales and
        DatosSensibles have an approved text (README open decision #3, resolved 2026-08-19);
        Comunicaciones has none yet.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: tipo
          in: path
          required: true
          schema: { type: string, enum: [DatosPersonales, DatosSensibles] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentimientoTextoResponse' }
        "400":
          description: TIPO_CONSENTIMIENTO_INVALIDO or TIPO_CONSENTIMIENTO_SIN_TEXTO (e.g. Comunicaciones).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: >
            NEGOCIO_AJENO — the token's NegocioId is not the business this database holds. A
            deployment serves one business (ARCHITECTURE §5), so this is checked rather than
            assumed: it never answers with another business's CUIT and address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------------------------------------------------
  # S3 · Ficha del socio — partially implemented
  # ---------------------------------------------------------------------
  /miembros/{miembroId}/saldo:
    get:
      tags: [Miembros]
      summary: S3 Ficha del socio — balance and cutoff date only
      x-status: implemented
      description: >
        Backed by ISaldoService + ICorteService. ISaldoService.ObtenerSaldoAsync looks the
        member up before computing SUM(Monto), so an unknown miembroId — or one that belongs
        to a different Negocio — 404s instead of returning a misleading 0.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MiembroId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaldoMiembroResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: No member with this id exists for the caller's Negocio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: No Corte declared for this Negocio yet (CORTE_NO_DECLARADO).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /miembros/{miembroId}/ficha-mostrador:
    get:
      tags: [Miembros]
      summary: S3 Ficha del socio — the full counter view (name, number, alerts)
      x-status: implemented
      description: >
        Backed by IFichaMostradorService, which 404s an unknown/another-business's
        miembroId (IMiembroRepository.GetByIdAsync) and builds the alert strip. Phase 1
        can only ever populate the Cumpleanos alert (RN-11: notice from 2 days before,
        day/month only) — AlergiaODieta needs PerfilMiembro (phase 3, F3-01) and
        ComprasHabituales needs phase-4 aggregation, so neither is ever produced yet.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MiembroId'
      responses:
        "200":
          description: OK — never phone or DNI for a Cajero (FUNCTIONAL-SPEC §5).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FichaMostradorResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: No member with this id exists for the caller's Negocio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /miembros/{miembroId}/completo:
    get:
      tags: [Miembros]
      summary: S6 Ficha completa (Encargada/Dueño only)
      x-status: implemented
      description: >
        Backed by IFichaCompletaService — the same Miembro lookup as ficha-mostrador,
        plus phone/DNI, plus a RegistroAuditoria row ("VerFichaCompleta", DATA-MODEL §2)
        written on every single read, not only the first.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MiembroId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FichaCompletaResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: No member with this id exists for the caller's Negocio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------------------------------------------------
  # S4 · Registrar canje — implemented
  # ---------------------------------------------------------------------
  /miembros/{miembroId}/canjes:
    post:
      tags: [Movimientos]
      summary: S4 Registrar canje (FUNCTIONAL-SPEC §6)
      x-status: implemented
      description: >
        Idempotent on claveIdempotencia (README decision #6, 2026-08-19). Backed by
        ISaldoService.RegistrarCanjeAsync, which checks IMovimientoRepository.GetPorClaveIdempotenciaAsync
        before writing anything: a retry with the same key and the same monto/fechaEfectiva/motivo
        returns the original 200 CanjeResponse, no second row. The actual guarantee against two
        concurrent identical requests both writing a Canje lives in a unique partial index on
        (NegocioId, ClaveIdempotencia), not only in this check.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MiembroId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarCanjeRequest' }
      responses:
        "200":
          description: >
            Redemption registered — the new balance, shown immediately. Also returned, with the
            same body, when claveIdempotencia matches an earlier successful attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanjeResponse' }
        "400":
          description: >
            MONTO_INVALIDO (≤ 0), CANJE_SUPERA_SALDO (I6/RN-24), SALDO_EN_REVISION (RN-25) or
            CLAVE_IDEMPOTENCIA_REQUERIDA (missing/blank claveIdempotencia).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: >
            CLAVE_IDEMPOTENCIA_REUTILIZADA — claveIdempotencia was already used for a different
            member, amount, date or reason. Not a retry; a client bug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------------------------------------------------
  # S7 · Historial de movimientos — implemented
  # ---------------------------------------------------------------------
  /miembros/{miembroId}/movimientos:
    get:
      tags: [Movimientos]
      summary: S7 Historial de movimientos (Encargada/Dueño only)
      x-status: implemented
      description: >
        Backed by IHistorialMovimientosService, a thin wrapper over
        IMovimientoRepository.GetPorMiembroAsync that also resolves each movement's
        UsuarioNombre and 404s an unknown/another-business's miembroId.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MiembroId'
      responses:
        "200":
          description: OK — newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MovimientoResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: No member with this id exists for the caller's Negocio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------------------------------------------------
  # S8 · Anular movimiento — implemented
  # ---------------------------------------------------------------------
  /movimientos/{movimientoId}/anular:
    post:
      tags: [Movimientos]
      summary: S8 Anular movimiento — writes an Ajuste, never an edit (I1)
      x-status: implemented
      description: >
        Backed by IAnulacionMovimientoService: looks up the original movement
        (IMovimientoRepository.GetByIdAsync, 404 for an unknown id or one belonging to
        another Negocio) and writes a new Ajuste of -Monto with the mandatory reason and
        the acting user from the JWT (I1, I3).
      security: [{ cookieAuth: [] }]
      parameters:
        - name: movimientoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnularMovimientoRequest' }
      responses:
        "200":
          description: OK — the Ajuste that corrects the original movement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovimientoResponse' }
        "400":
          description: MOTIVO_REQUERIDO — every Ajuste needs a reason (I3).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: No movement with this id exists for the caller's Negocio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------------------------------------------------
  # S9 · Cierre diario de canjes — implemented
  # ---------------------------------------------------------------------
  /sucursales/{sucursalId}/cierre-diario:
    get:
      tags: [Sucursales]
      summary: S9 Cierre diario de canjes (Encargada/Dueño only)
      x-status: implemented
      description: >
        Backed by ICierreDiarioService, which reads a business's Canje movements for one
        day and narrows them to one branch. A Canje carries no SucursalId of its own
        (DATA-MODEL §4 — branch is organisational, RN-07): "this branch's redemptions"
        means the ones registered by a cashier stationed at it (Usuario.SucursalId), not
        the member's own branch, so a redemption for a member from another branch still
        shows up here. Enforces the branch axis: an Encargada tied to one branch may only
        ask for that branch's own cierre (403 otherwise); Dueño has no branch claim and
        can ask for any.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: sucursalId
          in: path
          required: true
          schema: { type: integer }
        - name: fecha
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CierreDiarioResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The caller's own branch (Encargada) is not this sucursalId.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------------------------------------------------
  # S10 · Usuarios y sucursales — implemented
  # ---------------------------------------------------------------------
  /usuarios:
    get:
      tags: [Usuarios]
      summary: S10 Usuarios — list (Dueño only)
      x-status: implemented
      description: Backed by IUsuarioService.ListarAsync (IUsuarioRepository.ListarAsync is new).
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsuarioResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Usuarios]
      summary: S10 Usuarios — create (Dueño only)
      x-status: implemented
      description: >
        Backed by IUsuarioService.CrearAsync. Rol travels as text and is parsed against
        Domain's RolUsuario in Api — Sistema is rejected explicitly even though it is a
        valid CLR enum member, because no account may ever be created under it.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearUsuarioRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioResponse' }
        "400":
          description: ROL_INVALIDO, or SUCURSAL_REQUERIDA/SUCURSAL_NO_APLICA (DATA-MODEL §2).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: USUARIO_EMAIL_DUPLICADO — an account with that email already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /sucursales:
    get:
      tags: [Sucursales]
      summary: S10 Sucursales — list (Dueño only)
      x-status: implemented
      description: Backed by ISucursalService.ListarAsync (ISucursalRepository is new).
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SucursalResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Sucursales]
      summary: S10 Sucursales — create (Dueño only)
      x-status: implemented
      description: Backed by ISucursalService.CrearAsync.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearSucursalRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SucursalResponse' }
        "400":
          description: NOMBRE_REQUERIDO.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------
  # F1-14 · Socios sin vincular — implemented
  # ---------------------------------------------------------------------
  /miembros/sin-vincular:
    get:
      tags: [Miembros]
      summary: F1-14 Members with no ClienteExternoId (Encargada/Dueño)
      x-status: implemented
      description: >
        Backed by IVinculacionMiembroService.ListarSinVincularAsync. A member registered at the
        counter (S5) has no ClienteExternoId, so nothing accrues to it when sales are imported
        (DATA-MODEL §3) — this is the list that keeps that from happening silently. Never phone
        or DNI: linking a POS id does not need them.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK — oldest first, so the longest wait is at the top.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MiembroSinVincularResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'

  /miembros/{miembroId}/vinculacion:
    post:
      tags: [Miembros]
      summary: F1-14 Link a member to a POS customer id (Encargada/Dueño)
      x-status: implemented
      description: >
        Backed by IVinculacionMiembroService.VincularAsync. The uniqueness of
        (NegocioId, ClienteExternoId) is guaranteed by a partial unique index in Postgres, not
        only by this check — two concurrent requests claiming the same id cannot both win.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MiembroId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VincularClienteExternoRequest' }
      responses:
        "200":
          description: Linked — echoes the id as recorded, not as typed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VinculacionClienteExternoResponse' }
        "400":
          description: CLIENTE_EXTERNO_ID_REQUERIDO (missing or blank).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: >
            No such member in this business. A member of another business answers exactly the
            same way, so the response never reveals that the id exists elsewhere (I8).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: >
            MIEMBRO_YA_VINCULADO (this member already carries an id) or
            CLIENTE_EXTERNO_ID_DUPLICADO (another member of this business already claims it).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fidelizar_auth
      description: >
        JWT in an HttpOnly, Secure, SameSite=Strict cookie (ARCHITECTURE §8). Every
        state-changing request additionally requires the X-CSRF-TOKEN header.

  parameters:
    MiembroId:
      name: miembroId
      in: path
      required: true
      schema: { type: integer }
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
      description: From GET /auth/csrf-token. Required on every state-changing request (ARCHITECTURE §8).

  responses:
    Unauthorized:
      description: No valid session, or the role lacks the required policy.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Validation failure — see `details` for the offending field(s).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Login rate limit exceeded (ARCHITECTURE §8).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ---- The one error shape every endpoint uses (Fidelizar.Shared.Errors.ErrorResponse) ----
    ErrorResponse:
      type: object
      required: [errorCode, message]
      properties:
        errorCode: { type: string, example: CANJE_SUPERA_SALDO }
        message: { type: string, example: "El canje ($150.00) supera el saldo disponible ($100.00)." }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }

    # ---- Implemented (Fidelizar.Shared) ----
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    SesionResponse:
      type: object
      required: [id, nombreCompleto, rol, negocioId]
      properties:
        id: { type: integer }
        nombreCompleto: { type: string }
        rol: { type: string, enum: [Cajero, Encargada, Dueno, Soporte] }
        negocioId: { type: integer }
        sucursalId: { type: integer, nullable: true }

    SaldoMiembroResponse:
      type: object
      required: [miembroId, saldo, corteFecha]
      properties:
        miembroId: { type: integer }
        saldo: { type: number, format: double, description: "decimal on the wire; 2 decimals (I4)" }
        corteFecha: { type: string, format: date }

    RegistrarCanjeRequest:
      type: object
      required: [monto, fechaEfectiva, motivo, claveIdempotencia]
      properties:
        monto: { type: number, format: double, minimum: 0.01 }
        fechaEfectiva: { type: string, format: date, description: "May be in the past (ARCHITECTURE §10)." }
        motivo:
          type: string
          description: >
            Marked required here because MovimientoCredito.Crear currently requires it for
            every Canje regardless of date. FUNCTIONAL-SPEC §6 describes it as optional when
            fechaEfectiva is today — a real discrepancy between the two documents, flagged
            in docs/REST-CONTRACT-F1.md, not resolved by this contract.
        claveIdempotencia:
          type: string
          maxLength: 100
          description: >
            Generated by the client, one per redemption attempt — not one per logical
            redemption (README decision #6, 2026-08-19). A retry after a lost response
            (FLOW-S2-S5.md §3.8) reuses the same value: the server recognises it and returns
            the original CanjeResponse instead of writing a second Canje. The same key with
            different monto/fechaEfectiva/motivo/member is rejected as CLAVE_IDEMPOTENCIA_REUTILIZADA
            (409) — that is not a retry, it is a client mistake.

    CanjeResponse:
      type: object
      required: [movimientoId, monto, fechaEfectiva, saldoResultante]
      properties:
        movimientoId: { type: integer, format: int64 }
        monto: { type: number, format: double }
        fechaEfectiva: { type: string, format: date }
        saldoResultante: { type: number, format: double, description: "Historical evidence only (I2), never re-derived from this." }

    # ---- Pending — documented shape, not yet a C# type in Shared ----
    MiembroResumen:
      type: object
      description: >
        S2 search result row — name, member number, balance. Nothing else
        (FUNCTIONAL-SPEC §4). corteFecha closes the gap FLOW-S2-S5.md §1.4 flagged: R3
        ("not in any screen") requires the stale-data badge next to every rendered
        balance, including a search result row.
      properties:
        id: { type: integer }
        nombre: { type: string }
        numeroSocio: { type: string, nullable: true }
        saldo: { type: number, format: double }
        fechaAlta: { type: string, format: date, description: Shown only to disambiguate homonyms. }
        corteFecha: { type: string, format: date }

    MiembroSinVincularResponse:
      type: object
      description: >
        F1-14 — one member still without a ClienteExternoId. No phone and no DNI: Shared is
        compiled into the browser and linking a POS id needs neither. fechaAlta is what tells
        the Encargada how long the member has been waiting.
      properties:
        id: { type: integer }
        nombre: { type: string }
        numeroSocio: { type: string, nullable: true }
        fechaAlta: { type: string, format: date }
        sucursalId: { type: integer, nullable: true }

    VincularClienteExternoRequest:
      type: object
      required: [clienteExternoId]
      description: F1-14 — the POS customer id to link the member to.
      properties:
        clienteExternoId: { type: string }

    VinculacionClienteExternoResponse:
      type: object
      description: >
        F1-14 — the member as it stands after the link, so the screen confirms the exact id that
        was recorded rather than echoing what was typed.
      properties:
        miembroId: { type: integer }
        nombre: { type: string }
        clienteExternoId: { type: string }
        vinculadoEn: { type: string, format: date-time }

    FichaMostradorResponse:
      type: object
      description: S3 full counter view — never phone or DNI for a Cajero.
      properties:
        id: { type: integer }
        nombre: { type: string }
        numeroSocio: { type: string, nullable: true }
        saldo: { type: number, format: double }
        corteFecha: { type: string, format: date }
        alertas:
          type: array
          items:
            type: object
            properties:
              tipo: { type: string, enum: [SaldoDisponible, Cumpleanos, AlergiaODieta, ComprasHabituales] }
              texto: { type: string }

    FichaCompletaResponse:
      type: object
      description: S6 — Encargada/Dueño only.
      properties:
        id: { type: integer }
        nombre: { type: string }
        numeroSocio: { type: string, nullable: true }
        clienteExternoId: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        dni: { type: string, nullable: true }
        fechaNacimiento: { type: string, nullable: true, description: "Day and month only, RN-11." }
        sucursalId: { type: integer, nullable: true }
        activo: { type: boolean }

    AltaMiembroRequest:
      type: object
      description: S5 — consent is part of the form, not an afterthought (I10).
      required: [nombre, consentimientoDatosPersonales]
      properties:
        nombre: { type: string }
        clienteExternoId: { type: string, nullable: true, description: "409 CLIENTE_EXTERNO_ID_DUPLICADO if already linked to another member." }
        telefono: { type: string, nullable: true }
        dni: { type: string, nullable: true }
        fechaNacimientoDia: { type: integer, nullable: true, description: "Both or neither — RN-11 ignores the year, so there is no year field at all." }
        fechaNacimientoMes: { type: integer, nullable: true }
        sucursalId: { type: integer, nullable: true }
        consentimientoDatosPersonales:
          type: boolean
          description: >
            Must be true — mandatory (README open decision #3, resolved 2026-08-19: the
            approved text says alta is not possible without it). Alta is rejected before
            anything is written when this is false.
        consentimientoDatosSensibles:
          type: boolean
          description: >
            Optional — the approved text says explicitly that membership does not require it.
            Alta succeeds either way; only whether a DatosSensibles Consentimiento row is
            written differs. Revoking it later never touches the member or the ledger.

    ConsentimientoTextoResponse:
      type: object
      description: >
        The resolved wording for one consent type (README open decision #3, resolved
        2026-08-19) — this business's own name/CUIT/address already substituted in.
      properties:
        tipo: { type: string, enum: [DatosPersonales, DatosSensibles] }
        versionTexto: { type: string, description: "What a Consentimiento row stores when the member accepts." }
        texto: { type: string }

    MovimientoResponse:
      type: object
      description: S7/S8 — one ledger row.
      properties:
        id: { type: integer, format: int64 }
        tipo: { type: string, enum: [SaldoInicial, Acumulacion, Canje, Ajuste] }
        monto: { type: number, format: double }
        fechaEfectiva: { type: string, format: date }
        registradoEn: { type: string, format: date-time }
        motivo: { type: string, nullable: true }
        saldoResultante: { type: number, format: double }
        usuarioNombre: { type: string, nullable: true }

    AnularMovimientoRequest:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, description: "Mandatory — every Ajuste needs one (I3)." }

    CierreDiarioResponse:
      type: object
      description: S9 — today's redemptions in one branch.
      properties:
        sucursalId: { type: integer }
        fecha: { type: string, format: date }
        totalCanjeado: { type: number, format: double }
        movimientos:
          type: array
          items:
            type: object
            properties:
              miembroNombre: { type: string }
              monto: { type: number, format: double }
              cajeroNombre: { type: string }
              hora: { type: string, format: date-time }
              motivo: { type: string, nullable: true }

    UsuarioResponse:
      type: object
      properties:
        id: { type: integer }
        nombreCompleto: { type: string }
        email: { type: string, format: email }
        rol: { type: string, enum: [Cajero, Encargada, Dueno, Soporte] }
        sucursalId: { type: integer, nullable: true }
        activo: { type: boolean }

    CrearUsuarioRequest:
      type: object
      required: [nombreCompleto, email, password, rol]
      properties:
        nombreCompleto: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        rol: { type: string, enum: [Cajero, Encargada, Dueno, Soporte] }
        sucursalId: { type: integer, nullable: true, description: "Required for Cajero/Encargada." }

    SucursalResponse:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        codigoExterno: { type: string, nullable: true }
        activa: { type: boolean }

    CrearSucursalRequest:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string }
        codigoExterno: { type: string, nullable: true }

security:
  - cookieAuth: []
